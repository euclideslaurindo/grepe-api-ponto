# ==========================================================
# ===== BANCO EM MEMORIA H2 (LIGADO) =======================
# ==========================================================
spring.datasource.url=jdbc:h2:mem:grepedb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Habilita uma interface visual do banco H2 no navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Cria as tabelas na RAM automaticamente ao dar Play
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Otimizacao de conexoes para nao travar a maquina
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
spring.jpa.defer-datasource-initialization=true